<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Goutte d'eau principale — vert foncé -->
  <path d="M50 8
    C50 8, 20 45, 20 62
    C20 79, 34 92, 50 92
    C66 92, 80 79, 80 62
    C80 45, 50 8, 50 8 Z"
    fill="#0a5028"
  />

  <!-- Flamme dorée en haut à droite de la goutte -->
  <path d="M58 10
    C60 18, 68 24, 65 35
    C63 42, 58 44, 58 44
    C62 36, 56 28, 58 10 Z"
    fill="#b08c3c"
    opacity="0.9"
  />

  <!-- Montagne principale — or foncé (fond) -->
  <path d="M30 72 L45 45 L55 58 L62 48 L72 72 Z"
    fill="#b08c3c"
  />

  <!-- Montagne principale — vert (devant) -->
  <path d="M28 72 L44 47 L52 60 L60 50 L70 72 Z"
    fill="#0d5c2e"
  />

  <!-- Sommet enneigé gauche -->
  <path d="M44 47 L40 54 L48 54 Z"
    fill="white"
    opacity="0.85"
  />

  <!-- Sommet enneigé droite -->
  <path d="M60 50 L56 57 L64 57 Z"
    fill="white"
    opacity="0.85"
  />

  <!-- Lignes d'eau / prairie au bas de la goutte -->
  <path d="M28 74 Q38 70, 50 73 Q62 76, 72 73"
    fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.7"
  />
  <path d="M30 78 Q40 75, 50 77 Q60 79, 70 77"
    fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.5"
  />

  <!-- Reflet clair en haut à gauche de la goutte -->
  <path d="M36 28 Q38 20, 44 24 Q40 30, 36 28 Z"
    fill="white" opacity="0.25"
  />
</svg>
